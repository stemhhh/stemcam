<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1512">
  <meta name="description" content="NexoCam — conecta cualquier cámara o micrófono a OBS desde el navegador.">
  <title>NexoCam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/landing.css">
</head>
<body>
  <div class="stage">
    <header class="top">
      <p class="brand" id="brand">NexoCam</p>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-es" class="active">ES</button>
        <button type="button" id="lang-en">EN</button>
      </div>
    </header>

    <main class="hero">
      <h1 id="headline">Cualquier cámara. OBS. Un nexo.</h1>
      <p class="lead" id="lead">Conecta el teléfono, tablet u otro PC, o descarga el plugin para OBS.</p>
      <div class="cta">
        <a class="btn primary" id="connect" href="/app/">Conectar</a>
        <a class="btn ghost" id="download" href="https://github.com/nexocam/nexocam/releases/latest" target="_blank" rel="noopener">Descargar plugin</a>
      </div>
    </main>

    <footer class="foot">
      <a id="github" href="https://github.com/nexocam/nexocam" target="_blank" rel="noopener">GitHub</a>
      <a href="/privacy.html" id="privacy">Privacidad</a>
    </footer>
  </div>
  <script src="/config.js"></script>
  <script src="/landing.js"></script>
</body>
</html>
